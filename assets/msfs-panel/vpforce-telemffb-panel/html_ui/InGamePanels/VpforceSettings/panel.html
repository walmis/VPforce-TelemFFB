<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TelemFFB Settings</title>
    <link rel="stylesheet" href="panel.css" />
</head>
<body>
    <header id="header">
        <div id="headerTop">
            <div id="headerBrand">
                <img id="headerLogo" src="vpforcelogo.svg" alt="" />
                <div id="headerTitle">TelemFFB</div>
                <div id="panelVersion"></div>
            </div>
            <div id="scaleControl">
                <button id="scaleDown" class="scaleBtn">-</button>
                <span id="scaleLabel">100%</span>
                <button id="scaleUp" class="scaleBtn">+</button>
            </div>
        </div>
        <div id="headerSub">-</div>
        <div id="deviceTabs"></div>
        <div id="viewTabs">
            <button class="pill selected" data-view="settings">Settings</button>
            <button class="pill" data-view="monitor">Monitor</button>
        </div>
    </header>
    <div id="flagErrors"></div>
    <div id="waiting">Waiting for TelemFFB / MSFS aircraft...</div>
    <main id="settingsList"></main>
    <main id="monitorView">
        <div id="monitorBar">
            <button class="pill selected" data-filter="favorites">Favorites</button>
            <button class="pill" data-filter="all">All</button>
        </div>
        <div class="groupTitle">Active Effects</div>
        <div id="effectsList"></div>
        <div class="groupTitle">Telemetry</div>
        <div id="telemList"></div>
    </main>
    <script src="panel.js"></script>
</body>
</html>
